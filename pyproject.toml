[project]
name = "ctxlen"
version = "0.0.0"
description = "The context limits of any LLM: zero dependencies, no network, three functions"
requires-python = ">=3.9"
dependencies = ["httpx>=0.28,<1", "certifi"]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["llm", "litellm", "context window", "tokens", "models.dev"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/michaeltheologitis/ctxlen"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: real PyPI and GitHub; run with -m live"]
addopts = "-m 'not live'"
